name: Bug
description: wormsign crashes, hangs, or behaves in a way that the README does not describe.
labels: [bug]
body:
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: npx github:nukoe-labs/wormsign my-org --json
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output and exit code
      render: text
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: wormsign and Node.js versions
